[project]
name = "thingskit"
version = "0.1.0"
description = "CLI d'accès à Things 3 (Cultured Code) pour le harness agentique — lecture SQLite, écriture AppleScript/JSON."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Donaldo DE SOUSA", email = "donaldo@sowell.app" },
]
keywords = ["things3", "cli", "macos", "applescript", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DonaldoDes/thingskit"
Repository = "https://github.com/DonaldoDes/thingskit"
Issues = "https://github.com/DonaldoDes/thingskit/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
